[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsc-mcp"
version = "1.0.0"
description = "Local read-only Google Search Console MCP server for Cursor SEO agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9.0",
  "google-api-python-client>=2.160.0",
  "google-auth>=2.38.0",
  "google-auth-oauthlib>=1.2.1",
  "google-auth-httplib2>=0.2.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.10.0",
]

[project.scripts]
gsc-mcp = "gsc_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
